<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="سفرینو">
  <title>سفرینو</title>
  <!--
    Maskable variant. Android crops this to a circle, squircle or teardrop
    depending on the launcher, so everything that must survive sits inside the
    safe zone: a circle of radius 205 about the centre. The dial is scaled to
    ~72% of the full-bleed version to stay clear of every crop.
  -->
  <defs>
    <linearGradient id="mkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset=".52" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0B5E6B"/>
    </linearGradient>
    <linearGradient id="mkWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#F97362"/>
    </linearGradient>
    <radialGradient id="mkGlow" cx=".32" cy=".24" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#mkBg)"/>
  <rect width="512" height="512" fill="url(#mkGlow)"/>

  <g transform="translate(256 256) scale(0.72)">
    <circle r="146" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="14"/>

    <path d="M0 0 L0 -146 A146 146 0 0 1 126 -73 Z" fill="#ffffff" fill-opacity=".95"/>
    <path d="M0 0 L126 -73 A146 146 0 0 1 73 126 Z" fill="#ffffff" fill-opacity=".62"/>
    <path d="M0 0 L73 126 A146 146 0 0 1 -126 73 Z" fill="#ffffff" fill-opacity=".38"/>
    <path d="M0 0 L-126 73 A146 146 0 0 1 0 -146 Z" fill="#ffffff" fill-opacity=".78"/>

    <path d="M-96 96 L96 -96" stroke="url(#mkWarm)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="-96" cy="96" r="27" fill="#0B5E6B"/>
    <circle cx="-96" cy="96" r="15" fill="url(#mkWarm)"/>
    <circle cx="96" cy="-96" r="27" fill="#0B5E6B"/>
    <circle cx="96" cy="-96" r="15" fill="#FFFFFF"/>

    <circle r="26" fill="#0B5E6B"/>
    <circle r="13" fill="url(#mkWarm)"/>
  </g>
</svg>
